# Проверяет, что iOS-версия компилируется. Сборка без подписи: на iPhone её не поставить,
# для этого нужен Mac с Xcode и Apple ID.
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
