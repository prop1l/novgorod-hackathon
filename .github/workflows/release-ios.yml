# При публикации релиза собирает неподписанный .ipa и прикладывает его к релизу.
# Поставить на iPhone можно через AltStore или Sideloadly — они подпишут его вашим Apple ID.
name: iOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, к которому приложить .ipa
        required: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Ключ карты из секретов
        run: printf '{"MAPTILER_KEY":"%s"}' "${{ secrets.MAPTILER_KEY }}" > env.json

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=env.json

      - name: Упаковать .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "zdes-bylo-${TAG#v}-ios-unsigned.ipa" Payload

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "zdes-bylo-${TAG#v}-ios-unsigned.ipa" --clobber
